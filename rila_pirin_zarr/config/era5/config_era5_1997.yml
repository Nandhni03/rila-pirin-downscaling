# ERA5 hourly for the Rila-Pirin FABDEM run, 1997: 14 pressure levels 600-1000 hPa + the 7 single-level variables
# TopoPyScale needs, into one Zarr store. Generated by rila_pirin_zarr/scripts/make_configs.py.
# Settings as zarr_workflow/era5_download/config_era5_2020.yml (why: that folder's LOG.md / REPORT.md).
period:
  start: 1997-01-01
  end: 1997-12-31

area:                          # DEM extent + 0.4 deg, snapped to the 0.25 deg grid (same as all Rila-Pirin stores)
  north: 43.0
  west: 22.25
  south: 40.75
  east: 24.75

levels: [600, 650, 700, 750, 775, 800, 825, 850, 875, 900, 925, 950, 975, 1000]
plev_vars: [z, t, u, v, q, r]
surf_vars: [z_surf, d2m, sp, strd, ssrd, tp, t2m]

source:
  plev: ncar
  surf: cds                    # CDS, one request per year: NCAR OPeNDAP overloaded since 2026-11-05 19 UTC (LOG.md)

cds:
  workers: 2
  max_items_plev: 60000
  max_items_surf: 121000
  poll_seconds: 30
  max_retries: 5
  backoff_seconds: 120
  request_timeout_hours: 24

ncar:
  workers: 12                  # per lane; 2 lanes run at once (run_era5_lane.sh) -> 24 requests to NCAR
  base_url: https://thredds.rda.ucar.edu/thredds/ncss/grid/files/g/d633000/e5.oper.an.pl
  max_retries: 5
  backoff_seconds: 60
  timeout_seconds: 600

paths:
  store: /app/rila_pirin_zarr/data/era5_600-1000hPa/1997/ERA5.zarr
  raw: /app/rila_pirin_zarr/data/era5_600-1000hPa/1997/raw
  state: /app/rila_pirin_zarr/data/era5_600-1000hPa/1997/state
  logs: /app/rila_pirin_zarr/data/era5_600-1000hPa/1997/logs

store:
  time_chunk: 744
