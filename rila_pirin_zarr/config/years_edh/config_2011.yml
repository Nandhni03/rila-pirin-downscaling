# Rila-Pirin, FABDEM 30 m, year 2011, EDH series (5 levels): downscaling into Zarr (terrain caches linked from data/terrain).
# Generated by rila_pirin_zarr/scripts/make_configs.py; decisions in rila_pirin_zarr/LOG.md (2026-11-05).
project:
  name: Rila-Pirin FABDEM 2011 EDH
  description: FABDEM 30 m EPSG:32634, rectangle mask, k=1000 in 4 elevation groups (coef 0.5/1/1.5/2), features elev6 aspect2, ERA5 (Earth Data Hub) 5 levels 600/700/850/925/1000 hPa
  authors:
    - Nandhni, MSc GIS, West University of Timisoara
  date: 2026-11-05
  directory: /app/rila_pirin_zarr/data/runs_edh/2011
  start: 2011-01-01
  end: 2011-12-31
  split:
    IO: False
    time: 1
    space: None
  climate: era5
  extent:                                 # empty: from the DEM (+0.4 deg)
  parallelization:
    downscaling_method: multicore
    setting:
      multicore:
        CPU_cores: 24                     # machine: 32 threads, 62 GB
      dask:
        n_workers: 4
        threads_per_worker: 1
        memory_target_fraction: 0.95
        memory_limit: 1.2GB

climate:
  precip_lapse_rate: True
  era5:
    path: /app/rila_pirin_zarr/data/era5_edh/2011      # EDH fetch (fork fetch_era5_edh), resumable from edh_blocks/
    product: reanalysis
    timestep: 1h
    plevels: [600,650,700,750,775,800,825,850,875,900,925,950,975,1000]   # EDH has 600/700/850/925/1000 in this range: the ones the terrain needs
    download_threads: 4
    data_repository: edh
    edh_output_format: zarr
    edh_max_concurrency: 8
    realtime: False
    rm_daily: False
    zarr_store: ERA5.zarr

dem:
  path: /app/rila_pirin_zarr/data/dem
  file: dem.tif                           # FABDEM V1-2, 30 m, EPSG:32634 (~/fabdem/fabdem_32634_30m.tif)
  epsg: 32634
  horizon_increments: 10
  solar_position_method: nrel_numpy

sampling:
  method: toposub
  toposub:
    clustering_method: minibatchkmean
    n_clusters: 1000                      # 149/427/241/185 per group (ceil -> 1002)
    random_seed: 2
    clustering_features: {'x':1, 'y':1, 'elevation':6, 'slope':1, 'aspect_cos':2, 'aspect_sin':2, 'svf':1}
    clustering_mask: /app/rila_pirin_zarr/data/dem/mask.tif
    clustering_groups: /app/rila_pirin_zarr/data/dem/groups.tif                 # 1 <800, 2 800-1500, 3 1500-2000, 4 >=2000 m
    clustering_group_weights: /app/rila_pirin_zarr/data/dem/group_weights.csv   # pixels x coef 0.5/1/1.5/2, sum exactly 1

toposcale:
  interpolation_method: idw
  LW_terrain_contribution: True

outputs:
  directory: outputs
  variables: all
  file:
    clean_outputs: False                  # must stay False: True deletes the outputs folder
    clean_FSM: False
    df_centroids: df_centroids.pck
    ds_param: ds_param.zarr
    ds_solar: ds_solar.zarr
    da_horizon: da_horizon.zarr
    landform: landform.tif
    downscaled_pt: down_pt_*.nc           # not used (zarr_store is set)
    zarr_store: down.zarr                 # hourly, one store per year
    zarr_store_start: 2011-01-01
    zarr_store_end: 2011-12-31

clean_up:
  rm_tmp_dirs: True
