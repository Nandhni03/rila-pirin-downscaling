# ERA5 hourly for the Meridional Carpathians (whole Southern Carpathians rectangle), 2025: pressure levels 600-1000 hPa
# (all 14 ERA5 levels in that range) + the 7 single-level variables TopoPyScale needs, into one Zarr store read by
# topo_scale_zarr. Used by Nandhni's zarr_workflow/era5_download/era5_download.py (download / status / verify).
# Copy of zarr_workflow/era5_download/config_era5_2020.yml (both sources NCAR, run end to end there) with the
# Meridionali area and host paths. See LOG_27Oct.md.
#   ../venv/bin/python zarr_workflow/era5_download/era5_download.py meridionali_zarr/config/era5/config_era5_meridionali_2025.yml download --months 1

period:
  start: 2025-01-01            # first day (00:00 UTC); the store covers the whole year, filled month by month (--months)
  end: 2025-12-31              # last day, included (23:00 UTC)

area:                          # same 10 x 20 grid as the EDH store (data/era5_meridionali/ERA5.zarr):
  north: 46.5                  # DEM extent + 0.4 deg buffer, snapped outward to the 0.25 deg grid
  west: 21.5
  south: 44.25
  east: 26.25

# Every ERA5 level from 600 to 1000 hPa. 600 hPa (~4.2 km) is above the highest peak (Moldoveanu 2544 m).
levels: [600, 650, 700, 750, 775, 800, 825, 850, 875, 900, 925, 950, 975, 1000]

plev_vars: [z, t, u, v, q, r]                          # topo_scale_zarr.PLEV_VARS
surf_vars: [z_surf, d2m, sp, strd, ssrd, tp, t2m]       # topo_scale_zarr SURF set

source:
  plev: ncar                   # ncar (THREDDS server-side subset, no queue, ~2.6 h/yr) | cds (~1 job at a time)
  surf: ncar                   # ncar (OPeNDAP, 7 vars x 12 months; tp = lsp + cp) | cds (whole year, 1 request)

cds:
  workers: 2
  max_items_plev: 60000
  max_items_surf: 121000
  poll_seconds: 30
  max_retries: 5
  backoff_seconds: 120
  request_timeout_hours: 24

ncar:
  workers: 4                   # parallel NCSS requests (16 -> 4 on 2026-10-27 18:35: NCAR overloaded, 504s and timeouts)
  base_url: https://thredds.rda.ucar.edu/thredds/ncss/grid/files/g/d633000/e5.oper.an.pl
  max_retries: 5
  backoff_seconds: 60
  timeout_seconds: 600

paths:
  store: /home/andreiionita27/TopoPyScale-repo-github/downscaling/meridionali_zarr/data/era5_600-1000hPa/2025/ERA5.zarr
  raw: /home/andreiionita27/TopoPyScale-repo-github/downscaling/meridionali_zarr/data/era5_600-1000hPa/2025/raw
  state: /home/andreiionita27/TopoPyScale-repo-github/downscaling/meridionali_zarr/data/era5_600-1000hPa/2025/state
  logs: /home/andreiionita27/TopoPyScale-repo-github/downscaling/meridionali_zarr/data/era5_600-1000hPa/2025/logs
  edh_store: /home/andreiionita27/TopoPyScale-repo-github/downscaling/meridionali_zarr/data/era5_meridionali/ERA5.zarr   # cross-check at the 5 shared levels

store:
  time_chunk: 744
